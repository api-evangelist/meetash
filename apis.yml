name: MeetAsh
description: >-
  Ash (MeetAsh / Ash Wellness) is a New York-based health technology company,
  founded in 2019, that powers white-label at-home health testing programs for
  health plans, digital health companies, and public health organizations.
  Through a single, developer-friendly REST API integration, partners can
  trigger test kits, manage shipping logistics, and securely transmit results
  back into an EHR or patient portal across a national network of CLIA- and
  CAP-certified laboratories. Ash offers 120+ at-home diagnostic panels
  (hormone, cancer, allergy, STI, chronic condition, and infectious-disease
  testing with self-collected blood, stool, urine, saliva, and swab samples),
  care-gap-closure programs for HEDIS measures, kitting and fulfillment,
  physician-of-record services, and real-time reporting dashboards. The
  platform is fully HIPAA compliant and SOC 2 Type II certified, with
  enterprise-grade encryption protecting PHI. Surfaced as a 500 Global
  portfolio company and enriched into the API Evangelist network; the developer
  documentation is partner-gated (password protected).
